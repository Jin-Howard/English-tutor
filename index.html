<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>AI English Tutor</title>
<style>
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
         font-family: sans-serif; background: #fff; color: #222; }
  /* 설정 화면 */
  #setup { flex: 1; overflow-y: auto; padding: 16px; }
  #setup label { display: block; margin-bottom: 14px; font-weight: bold; }
  #setup input, #setup select { display: block; width: 100%; box-sizing: border-box;
         margin-top: 6px; padding: 10px; font-size: 16px; }
  #save { width: 100%; padding: 14px; font-size: 18px; border: 0;
          border-radius: 12px; background: #ffe066; }
  #back { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; }
  #err { color: #e03131; min-height: 1.2em; }
  /* 대화 화면 */
  #main { flex: 1; flex-direction: column; min-height: 0; }
  #top { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 12px; background: #fff9db; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { max-width: 80%; margin: 8px 0; padding: 10px 14px;
         border-radius: 16px; white-space: pre-wrap; }
  .user { background: #ffe066; margin-left: auto; }
  .ai { background: #eee; }
  .ko { background: #e7f5ff; font-size: 14px; }
  /* 입력 막대 */
  #bar { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #eee; }
  #lang { padding: 0 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 24px; background: #fff; }
  #inp { flex: 1; min-width: 0; padding: 12px 16px; font-size: 16px;
         border: 1px solid #ccc; border-radius: 24px; }
  #act { width: 48px; height: 48px; font-size: 20px; border: 0; border-radius: 24px;
         background: #333; color: #fff; }
  #act.on { background: #e03131; }
  #bar.listening #inp, #bar.listening #lang { display: none; }
  #bar.listening #act { flex: 1; }
  /* 기록 화면 */
  #hist { flex: 1; overflow-y: auto; padding: 16px; }
  #hback { width: 100%; padding: 12px; font-size: 16px; }
  .rprev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 단어 카드 */
  .w { text-decoration: underline dotted #999; }
  .card { max-width: 80%; margin: -2px 0 10px; padding: 10px 14px; border-radius: 12px;
          background: #fff9db; border: 1px solid #ffe066; font-size: 14px; }
  .vex { color: #555; font-size: 13px; margin-top: 2px; }
  .vsave { margin-top: 8px; padding: 6px 12px; font-size: 14px; }
  .vdel { padding: 6px 12px; font-size: 14px; }
  .vspk { border: 0; background: none; font-size: 16px; padding: 0 6px; }
  /* 단어장 화면 */
  #vocab { flex: 1; overflow-y: auto; padding: 16px; }
  #vback { width: 100%; padding: 12px; font-size: 16px; }
  .vitem { padding: 10px 0; border-bottom: 1px solid #eee; }
  .vrow { display: flex; align-items: center; gap: 8px; }
  .vtxt { flex: 1; min-width: 0; cursor: pointer; }
  .vdet { padding-left: 8px; }
  .vmore { margin-top: 8px; padding: 6px 12px; font-size: 14px; }
  .vtitle { font-weight: bold; font-size: 16px; }
  .vnote { white-space: pre-line; color: #555; font-size: 13px; }
  .vsec { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #d4c26a; }
  #ver { margin-right: auto; align-self: center; font-size: 12px; color: #999; }
  .vw { font-size: 18px; font-weight: bold; }
  /* 듣는 중 막대 */
  .bars { display: inline-flex; align-items: center; gap: 3px; height: 20px;
          vertical-align: middle; }
  .bars i { width: 4px; height: 100%; border-radius: 2px; background: #fff;
            animation: wave .9s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: .15s; }
  .bars i:nth-child(3) { animation-delay: .3s; }
  .bars i:nth-child(4) { animation-delay: .45s; }
  .bars i:nth-child(5) { animation-delay: .6s; }
  @keyframes wave { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
  /* 답변 기다리는 중 점 */
  .wait i { display: inline-block; width: 5px; height: 5px; margin-left: 4px;
            border-radius: 50%; background: #888; animation: blink 1.2s infinite; }
  .wait i:nth-child(2) { animation-delay: .2s; }
  .wait i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
</style>
</head>
<body>

<div id="setup">
  <h2>처음 설정</h2>
  <label>API 키<input id="f-key" placeholder="API 키 붙여넣기"></label>
  <label>나이<input id="f-age" type="number" min="5" max="100"></label>
  <label>성별
    <select id="f-gender">
      <option value="">선택</option><option>남성</option><option>여성</option>
    </select>
  </label>
  <label>영어 수준
    <select id="f-level">
      <option value="">선택</option><option>토익</option><option>토플</option>
      <option>아이엘츠</option><option>초등회화 미만</option>
    </select>
    <input id="f-score" type="number" step="any" placeholder="점수 (예: 600)">
  </label>
  <label>학습분야
    <input id="f-field" list="fields" placeholder="목록에서 고르거나 직접 입력">
  </label>
  <datalist id="fields">
    <option value="병원"><option value="교회"><option value="학교"><option value="회사">
  </datalist>
  <label>알림시각<input id="f-time" type="time"></label>
  <p id="err"></p>
  <button id="save">저장하고 시작</button>
  <button id="back">돌아가기</button>
</div>

<div id="main">
  <div id="top"><span id="ver">v11</span><button id="vocabbtn">단어장</button><button id="histbtn">기록</button><button id="settings">설정</button></div>
  <div id="chat"></div>
  <form id="bar">
    <button type="button" id="lang"></button>
    <input id="inp" placeholder="영어·한글로 입력하세요" enterkeyhint="send" autocomplete="off">
    <button type="button" id="act"></button>
  </form>
</div>

<div id="vocab">
  <button id="vback">돌아가기</button>
  <h2>단어장</h2>
  <div id="vlist"></div>
</div>

<div id="hist">
  <button id="hback">돌아가기</button>
  <h2 id="htitle">기록</h2>
  <div id="hlist"></div>
  <div id="hview"></div>
</div>

<script>
// 설정값: 여기만 고치면 됨
const MODEL = 'gemini-3.5-flash';  // 모델명
const MAX_TURNS = 6;               // API로 보낼 최근 대화 횟수
const BASE_SYSTEM = `You are a friendly English tutor. Reply in 1-2 short English sentences and end with a simple question. Be perceptive: use the conversation so far and the learner's field of interest to guess what they most likely meant, and answer that.
The user's text may come from speech recognition: never comment on repeated words, fillers, capitalization, punctuation or apostrophes.
If the user writes in Korean: when it is something they want to say, give the natural English way to say it as your English reply and ask them to try saying it; when it is a question about English, answer it in Korean after "KO:" and then continue in English.
Only if the user made a real grammar or word-choice mistake, or the meaning is unclear or unfinished, add a new line starting with "KO:". In Korean, guess their intent and ask, in the form "혹시 ~라고 말하고 싶으셨어요? → natural English sentence" (if they seem to be asking something: "혹시 ~가 궁금하셨어요? → natural English question"). Then at most one short sentence on when the right word is used. No grammar lectures.
Otherwise do not write KO:.`;

const $ = id => document.getElementById(id);
const F = ['age', 'gender', 'level', 'score', 'field', 'time'];  // 저장할 설정 항목
const NONE = '초등회화 미만';
const dayKey = (() => {  // 오늘 날짜 (YYYY-MM-DD)
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
})();
let chats = JSON.parse(localStorage.getItem('chats') || '{}');  // 날짜별 대화 기록
let history = chats[dayKey] || [];  // 오늘 대화
const saveChats = () => localStorage.setItem('chats', JSON.stringify(chats));
let apiKey = localStorage.getItem('gkey') || '';
let profile = JSON.parse(localStorage.getItem('profile') || 'null');
let vocab = JSON.parse(localStorage.getItem('vocab') || '[]');  // 저장한 단어
const cache = new Map();  // 이번 접속 중 조회한 단어

// 화면 전환
function show(screen) {
  ['setup', 'main', 'vocab', 'hist'].forEach(s => {
    $(s).style.display = s !== screen ? 'none' : (s === 'main' ? 'flex' : 'block');
  });
  if (screen === 'main') $('chat').scrollTop = $('chat').scrollHeight;
}

// 점수칸: 초등회화 미만이면 숨김
function toggleScore() {
  $('f-score').style.display = $('f-level').value === NONE ? 'none' : 'block';
}
$('f-level').onchange = toggleScore;

// 저장된 값을 입력칸에 채우기
function fillForm() {
  const p = profile || {};
  $('f-key').value = apiKey;
  F.forEach(k => $('f-' + k).value = p[k] || '');
  toggleScore();
  $('back').style.display = profile ? 'block' : 'none';
}

// 저장 버튼: 빈 칸 검사 후 저장
$('save').onclick = () => {
  const key = $('f-key').value.trim();
  const p = {};
  F.forEach(k => p[k] = $('f-' + k).value.trim());
  if (p.level === NONE) p.score = '';
  const need = F.filter(k => !(k === 'score' && p.level === NONE));
  if (!key || need.some(k => !p[k])) {
    $('err').textContent = '모든 항목을 입력해 주세요';
    return;
  }
  apiKey = key;
  profile = p;
  localStorage.setItem('gkey', key);
  localStorage.setItem('profile', JSON.stringify(p));
  $('err').textContent = '';
  show('main');
};
$('settings').onclick = () => { fillForm(); show('setup'); };
$('back').onclick = () => show('main');

// 튜터 역할 문장 + 설정 정보
function buildSystem() {
  const lv = profile.level === NONE
    ? 'below elementary conversation (use very simple words)'
    : `${profile.level} ${profile.score}`;
  return `${BASE_SYSTEM}
Learner: age ${profile.age}, ${profile.gender}, English level: ${lv}. Field of interest: ${profile.field}. Match the level and use situations and words from that field.`;
}

// 말풍선 추가
function addMsg(text, cls, box = $('chat')) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

// 답변 읽어주기 (영어만)
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  speechSynthesis.speak(u);
}

// 요소 만들기
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

// 제미나이 호출 공통 함수: 답변 글자만 돌려줌
async function gemini(body) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify(body)
    }
  );
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || res.status);
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error('빈 응답');
  return text;
}

// 응답을 줄 단위로 나누기 (번호 제거)
const lines = t => t.split('\n').map(l => l.replace(/^\s*[1-4][.)]\s*/, '').trim()).filter(Boolean);

// 단어 뜻 조회: 눌렀을 때만 짧게 호출
async function lookup(word, context) {
  const text = await gemini({
    contents: [{ role: 'user', parts: [{ text:
      `Word: "${word}"\nSentence: "${context}"\nAnswer in exactly 4 lines, no labels, no numbering, no markdown:\nline 1: base form of the word (the word itself if already base)\nline 2: Korean meaning as "ⓝ 뜻" (noun), "ⓥ 뜻" (verb), "ⓐ 뜻" (adjective), "ⓓ 뜻" (adverb) or "ⓞ 뜻" (other). Put the sense used in the sentence first, at most 2 parts of speech joined by " · ", verbs in dictionary form like "ⓥ 달리다"\nline 3: one short English example sentence using the word\nline 4: Korean translation of line 3` }] }],
    generationConfig: { temperature: 0.1, maxOutputTokens: 1000 }
  });
  const [base, meaning, ex, exko] = lines(text);
  if (!exko) throw new Error('응답 형식 오류');
  return { base: base.toLowerCase(), meaning, ex, exko };
}

// 저장한 단어의 예문 목록 (옛 저장 형식도 읽기)
const exsOf = v => v.exs || (v.ex ? [{ ex: v.ex, exko: v.exko }] : []);

// 저장한 단어로 새 예문 하나 더 만들기
async function moreEx(v) {
  const text = await gemini({
    contents: [{ role: 'user', parts: [{ text:
      `Word: "${v.w}" (${v.meaning})\nExisting sentences: ${exsOf(v).map(e => e.ex).join(' | ') || 'none'}\nWrite one new short English sentence using the word, different from the existing ones. Answer in exactly 2 lines, no labels, no numbering, no markdown:\nline 1: the sentence\nline 2: Korean translation` }] }],
    generationConfig: { temperature: 0.5, maxOutputTokens: 1000 }
  });
  const [ex, exko] = lines(text);
  if (!exko) throw new Error('응답 형식 오류');
  return { ex, exko };
}

// 단어 저장/찾기
const findWord = w => vocab.find(v => v.w === w);
const saveVocab = () => localStorage.setItem('vocab', JSON.stringify(vocab));

// 기본 단어 설명표: 누르면 예문 대신 쓰임 설명 (API 호출 없음)
const BASIC = {};
function addBasic(items, mark, note) {  // items: ['단어 뜻', ...]
  const table = note || items.join(' · ');
  items.forEach(it => {
    const [w, ...m] = it.split(' ');
    BASIC[w.toLowerCase()] = { meaning: `${mark} ${m.join(' ')}`, note: table };
  });
}
addBasic(['I 나는(주어)', 'my 나의(소유)', 'me 나를·나에게(목적)', 'mine 나의 것', 'myself 나 자신'], 'ⓞ');
addBasic(['you 너는(주어)·너를(목적)', 'your 너의(소유)', 'yours 너의 것', 'yourself 너 자신', 'yourselves 너희 자신'], 'ⓞ');
addBasic(['he 그는(주어)', 'his 그의(소유)·그의 것', 'him 그를·그에게(목적)', 'himself 그 자신'], 'ⓞ');
addBasic(['she 그녀는(주어)', 'her 그녀의(소유)·그녀를(목적)', 'hers 그녀의 것', 'herself 그녀 자신'], 'ⓞ');
addBasic(['it 그것은(주어)·그것을(목적)', 'its 그것의(소유)', 'itself 그것 자체'], 'ⓞ',
  "it 그것은(주어)·그것을(목적) · its 그것의(소유) · itself 그것 자체\nits는 '그것의', it's는 it is의 줄임말이에요");
addBasic(['we 우리는(주어)', 'our 우리의(소유)', 'us 우리를·우리에게(목적)', 'ours 우리의 것', 'ourselves 우리 자신'], 'ⓞ');
addBasic(['they 그들은(주어)', 'their 그들의(소유)', 'them 그들을·그들에게(목적)', 'theirs 그들의 것', 'themselves 그들 자신'], 'ⓞ');
addBasic(['am ~이다(I 전용)', 'is ~이다(he·she·it)', 'are ~이다(you·we·they)', 'was ~였다(I·he·she·it)',
  'were ~였다(you·we·they)', 'be ~이다(원형)', 'been ~였다(완료형에 사용)', 'being ~인 중(진행형에 사용)',
  "i'm I am의 줄임말", "you're you are의 줄임말", "we're we are의 줄임말", "they're they are의 줄임말"], 'ⓥ',
  'be동사 (~이다 / ~에 있다)\n현재: I am · he/she/it is · you/we/they are\n과거: I/he/she/it was · you/we/they were\n원형 be · 완료 been · 진행 being');

// 소리 버튼 + 글자 한 줄
function speakRow(shown, spoken, cls) {
  const row = el('div', cls);
  const spk = el('button', 'vspk', '🔊');
  spk.onclick = () => speak(spoken);
  row.append(shown, spk);
  return row;
}

// 단어를 눌렀을 때: 읽어주기 + 뜻 카드
async function onWord(bubble, word, context) {
  const w = word.toLowerCase().replace('’', "'");
  speak(w);
  if (bubble.card) bubble.card.remove();
  const card = el('div', 'card', '찾는 중...');
  bubble.after(card);
  bubble.card = card;
  try {
    const sv = findWord(w);
    // 기본 단어표 > 저장된 단어(뜻만) > 이번 접속 조회분 순, 모두 호출 없음
    let d = BASIC[w] ? { base: '', ...BASIC[w] } : sv ? { base: sv.base, meaning: sv.meaning } : cache.get(w);
    if (!d) { d = await lookup(w, context); cache.set(w, d); }
    const btn = el('button', 'vsave', sv ? '저장됨' : '저장');
    btn.disabled = !!sv;
    btn.onclick = () => {
      vocab.push(d.note ? { w, base: '', meaning: d.meaning }
        : { w, base: d.base !== w ? d.base : '', meaning: d.meaning, exs: [{ ex: d.ex, exko: d.exko }] });
      saveVocab();
      btn.textContent = '저장됨';
      btn.disabled = true;
    };
    card.textContent = '';
    card.append(speakRow(d.base && d.base !== w ? `${w} (${d.base})` : w, w, 'vtitle'), el('div', '', d.meaning));
    if (d.note) card.append(el('div', 'vnote vsec', d.note));
    else if (d.ex) {
      const sec = el('div', 'vsec');
      sec.append(speakRow(d.ex, d.ex, 'vex'), el('div', 'vex', d.exko));
      card.append(sec);
    }
    card.append(btn);
  } catch (e) {
    card.textContent = '오류: ' + e.message;
  }
}

// 튜터 영어 답변: 단어마다 누를 수 있게 나눠서 표시
function addAiMsg(text, box = $('chat')) {
  const d = el('div', 'msg ai');
  text.split(/([A-Za-z'’]+)/).forEach((part, i) => {
    if (i % 2 === 0) return d.append(part);  // 단어가 아닌 부분
    const s = el('span', 'w', part);
    s.onclick = () => onWord(d, part, text);
    d.append(s);
  });
  box.append(d);
  box.scrollTop = box.scrollHeight;
}

// 저장된 대화 한 줄 그리기 (tap이 true면 단어를 누를 수 있음)
function drawMsg(m, box, tap) {
  const t = m.parts[0].text;
  if (m.role === 'user') return addMsg(t, 'user', box);
  const [en, ko] = t.split('KO:');  // KO: 앞은 영어, 뒤는 한국어 설명
  if (en.trim()) tap ? addAiMsg(en.trim(), box) : addMsg(en.trim(), 'ai', box);
  if (ko) addMsg(ko.trim(), 'ko', box);
}

// 단어장 목록 그리기 (최근 저장이 위, 누르면 예문 펼침)
function renderVocab() {
  const box = $('vlist');
  box.textContent = vocab.length ? '' : '저장한 단어가 없어요';
  [...vocab].reverse().forEach(v => {
    const det = el('div', 'vdet');
    det.style.display = 'none';
    const drawDet = () => {  // 예문 목록 + 더 보기 버튼
      det.textContent = '';
      if (BASIC[v.w]) return det.append(el('div', 'vnote vsec', BASIC[v.w].note));  // 기본 단어는 설명만
      exsOf(v).forEach(e => {
        const sec = el('div', 'vsec');
        sec.append(speakRow(e.ex, e.ex, 'vex'), el('div', 'vex', e.exko));
        det.append(sec);
      });
      const more = el('button', 'vmore', '예문 더 보기');
      more.onclick = async () => {
        more.disabled = true;
        more.textContent = '만드는 중...';
        try {
          v.exs = [...exsOf(v), await moreEx(v)];
          saveVocab();
          drawDet();
        } catch (err) {
          more.disabled = false;
          more.textContent = '오류: ' + err.message + ' (다시 누르기)';
        }
      };
      det.append(more);
    };
    const line = el('div', 'vtxt');
    line.append(el('span', 'vw', v.w), `${v.base ? ` (${v.base})` : ''} : ${v.meaning}`);
    line.onclick = () => {
      const open = det.style.display === 'none';
      det.style.display = open ? 'block' : 'none';
      if (open) drawDet();
    };
    const del = el('button', 'vdel', '삭제');
    del.onclick = () => {
      if (!confirm(`'${v.w}' 삭제할까요?`)) return;
      vocab = vocab.filter(x => x.w !== v.w);
      saveVocab();
      renderVocab();
    };
    const spk = el('button', 'vspk', '🔊');
    spk.onclick = () => speak(v.w);
    const row = el('div', 'vrow');
    row.append(spk, line, del);
    const item = el('div', 'vitem');
    item.append(row, det);
    box.append(item);
  });
}
$('vocabbtn').onclick = () => { renderVocab(); show('vocab'); };
$('vback').onclick = () => show('main');

// 기록 화면: 날짜 목록, 누르면 그날 대화 보기
let viewing = null;  // 보고 있는 날짜 (목록이면 null)
function renderHistList() {
  viewing = null;
  $('htitle').textContent = '기록';
  $('hview').style.display = 'none';
  const box = $('hlist');
  box.style.display = 'block';
  const days = Object.keys(chats).filter(d => chats[d].length).sort().reverse();
  box.textContent = days.length ? '' : '저장된 대화가 없어요';
  days.forEach(d => {
    const list = chats[d];
    const info = el('div', 'vtxt');
    info.append(el('b', '', `${d} · ${list.filter(m => m.role === 'user').length}번`),
                el('div', 'vex rprev', list[0].parts[0].text));
    info.onclick = () => openDay(d);
    const exp = el('button', 'vdel', '내보내기');
    exp.onclick = () => exportTxt(d);
    const del = el('button', 'vdel', '삭제');
    del.onclick = () => {
      if (!confirm(`${d} 대화를 삭제할까요?`)) return;
      delete chats[d];
      saveChats();
      if (d === dayKey) { history = []; $('chat').textContent = ''; }
      renderHistList();
    };
    const row = el('div', 'vrow');
    row.append(info, exp, del);
    const item = el('div', 'vitem');
    item.append(row);
    box.append(item);
  });
}

// 그날 대화를 읽기 전용으로 보기
function openDay(d) {
  viewing = d;
  $('htitle').textContent = d;
  $('hlist').style.display = 'none';
  const v = $('hview');
  v.style.display = 'block';
  v.textContent = '';
  chats[d].forEach(m => drawMsg(m, v, false));
}

// 그날 대화를 txt 파일로 저장 (다운로드 폴더)
function exportTxt(d) {
  const body = chats[d].map(m => {
    const t = m.parts[0].text;
    if (m.role === 'user') return `나: ${t}`;
    const [en, ko] = t.split('KO:');
    return `튜터: ${en.trim()}` + (ko ? `\n설명: ${ko.trim()}` : '');
  }).join('\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([`${d} 영어 대화\n\n${body}\n`], { type: 'text/plain;charset=utf-8' }));
  a.download = `english-${d}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('histbtn').onclick = () => { renderHistList(); show('hist'); };
$('hback').onclick = () => (viewing ? renderHistList() : show('main'));

// 제미나이에게 보내고 답 받기
async function send(text) {
  addMsg(text, 'user');
  history.push({ role: 'user', parts: [{ text }] });
  const wait = el('div', 'msg ai wait');  // 답변 기다리는 표시
  wait.innerHTML = '답변 정리하는 중<i></i><i></i><i></i>';
  $('chat').append(wait);
  $('chat').scrollTop = $('chat').scrollHeight;
  try {
    const reply = await gemini({
      system_instruction: { parts: [{ text: buildSystem() }] },
      contents: history.slice(-(MAX_TURNS * 2 - 1)),
      generationConfig: { temperature: 0.7, maxOutputTokens: 600 }
    });
    history.push({ role: 'model', parts: [{ text: reply }] });
    chats[dayKey] = history;
    saveChats();
    drawMsg(history[history.length - 1], $('chat'), true);
    speak(reply.split('KO:')[0]);
  } catch (e) {
    history.pop();  // 실패한 질문은 기록에서 제거
    addMsg('오류: ' + e.message, 'ai');
  } finally {
    wait.remove();
  }
}

// 입력 막대: 글자 입력 + 말하기(한/EN)를 버튼 하나로
const bar = $('bar'), inp = $('inp'), act = $('act'), langBtn = $('lang');
const BARS = '<span class="bars"><i></i><i></i><i></i><i></i><i></i></span>';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let lang = localStorage.getItem('lang') || 'en-US';  // 말하기 언어
let listening = false;  // 듣는 중 여부
let heard = '';         // 말한 내용 누적

const closeCards = () => document.querySelectorAll('.card').forEach(c => c.remove());

// 상태에 맞게 버튼 모양 바꾸기: 빈 칸이면 마이크, 글자가 있으면 전송, 듣는 중이면 막대
function paint() {
  langBtn.textContent = lang === 'en-US' ? '🎤 EN' : '🎤 한';
  bar.classList.toggle('listening', listening);
  act.classList.toggle('on', listening);
  act.innerHTML = listening ? BARS : (inp.value.trim() ? '➤' : '🎤');
}
langBtn.onclick = () => {
  lang = lang === 'en-US' ? 'ko-KR' : 'en-US';
  localStorage.setItem('lang', lang);
  paint();
};
inp.oninput = paint;

const rec = SR ? new SR() : null;
if (rec) {
  rec.onresult = e => { heard += ' ' + e.results[0][0].transcript; };
  rec.onend = () => {
    if (listening) return rec.start();  // 말이 멈춰 끊겨도 계속 듣기
    paint();
    if (heard.trim()) send(heard.trim());
    heard = '';
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    listening = false;
    addMsg('마이크 오류: ' + e.error, 'ai');
  };
} else {
  langBtn.style.display = 'none';
}

// 버튼: 듣는 중이면 끝내고 전송 / 글자가 있으면 전송 / 비어 있으면 듣기 시작
act.onclick = () => {
  if (listening) { listening = false; return rec.stop(); }
  closeCards();  // 단어 카드 닫기
  const t = inp.value.trim();
  if (t) { inp.value = ''; paint(); return send(t); }
  if (!rec) return addMsg('이 브라우저는 음성 입력을 지원하지 않아요. 글로 입력해 주세요', 'ai');
  speechSynthesis.cancel();
  heard = '';
  listening = true;
  rec.lang = lang;
  rec.start();
  paint();
};
bar.onsubmit = e => {  // 키보드의 엔터(전송) 키
  e.preventDefault();
  if (inp.value.trim()) act.onclick();
};

// 시작: 오늘 대화 복원, 설정이 있으면 대화 화면, 없으면 설정 화면
history.forEach(m => drawMsg(m, $('chat'), true));
paint();
fillForm();
show(profile && apiKey ? 'main' : 'setup');
</script>
</body>
</html>
