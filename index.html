<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI English Tutor</title>
<style>
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
         font-family: sans-serif; background: #fff; color: #222; }
  /* 설정 화면 */
  #setup { flex: 1; overflow-y: auto; padding: 16px; }
  #setup label { display: block; margin-bottom: 14px; font-weight: bold; }
  #setup input, #setup select { display: block; width: 100%; box-sizing: border-box;
         margin-top: 6px; padding: 10px; font-size: 16px; }
  #save { width: 100%; padding: 14px; font-size: 18px; border: 0;
          border-radius: 12px; background: #ffe066; }
  #back { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; }
  #err { color: #e03131; min-height: 1.2em; }
  /* 대화 화면 */
  #main { flex: 1; flex-direction: column; min-height: 0; }
  #top { display: flex; justify-content: flex-end; padding: 8px 12px; background: #fff9db; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { max-width: 80%; margin: 8px 0; padding: 10px 14px;
         border-radius: 16px; white-space: pre-wrap; }
  .user { background: #ffe066; margin-left: auto; }
  .ai { background: #eee; }
  .ko { background: #e7f5ff; font-size: 14px; }
  #mic { margin: 12px; padding: 16px; font-size: 18px; border: 0;
         border-radius: 12px; background: #333; color: #fff; }
  #mic.on { background: #e03131; }
</style>
</head>
<body>

<div id="setup">
  <h2>처음 설정</h2>
  <label>API 키<input id="f-key" placeholder="API 키 붙여넣기"></label>
  <label>나이<input id="f-age" type="number" min="5" max="100"></label>
  <label>성별
    <select id="f-gender">
      <option value="">선택</option><option>남성</option><option>여성</option>
    </select>
  </label>
  <label>영어 수준
    <select id="f-level">
      <option value="">선택</option><option>토익</option><option>토플</option>
      <option>아이엘츠</option><option>초등회화 미만</option>
    </select>
    <input id="f-score" type="number" step="any" placeholder="점수 (예: 600)">
  </label>
  <label>학습분야
    <input id="f-field" list="fields" placeholder="목록에서 고르거나 직접 입력">
  </label>
  <datalist id="fields">
    <option value="병원"><option value="교회"><option value="학교"><option value="회사">
  </datalist>
  <label>알림시각<input id="f-time" type="time"></label>
  <p id="err"></p>
  <button id="save">저장하고 시작</button>
  <button id="back">돌아가기</button>
</div>

<div id="main">
  <div id="top"><button id="settings">설정</button></div>
  <div id="chat"></div>
  <button id="mic">말하기</button>
</div>

<script>
// 설정값: 여기만 고치면 됨
const MODEL = 'gemini-3.5-flash';  // 모델명
const MAX_TURNS = 6;               // API로 보낼 최근 대화 횟수
const BASE_SYSTEM = `You are a friendly English tutor. Reply in 1-2 short English sentences and end with a simple question.
If the user made a mistake or used an unnatural word, add a new line starting with "KO:" and explain in Korean in 1-2 short sentences: when the right word is used, why the user's word is wrong, and the corrected sentence.
If there is no mistake, do not write KO:. If the user asks something in Korean, answer in Korean after "KO:".`;

const $ = id => document.getElementById(id);
const F = ['age', 'gender', 'level', 'score', 'field', 'time'];  // 저장할 설정 항목
const NONE = '초등회화 미만';
let history = [];  // 대화 기록
let apiKey = localStorage.getItem('gkey') || '';
let profile = JSON.parse(localStorage.getItem('profile') || 'null');

// 화면 전환
function show(screen) {
  $('setup').style.display = screen === 'setup' ? 'block' : 'none';
  $('main').style.display = screen === 'main' ? 'flex' : 'none';
}

// 점수칸: 초등회화 미만이면 숨김
function toggleScore() {
  $('f-score').style.display = $('f-level').value === NONE ? 'none' : 'block';
}
$('f-level').onchange = toggleScore;

// 저장된 값을 입력칸에 채우기
function fillForm() {
  const p = profile || {};
  $('f-key').value = apiKey;
  F.forEach(k => $('f-' + k).value = p[k] || '');
  toggleScore();
  $('back').style.display = profile ? 'block' : 'none';
}

// 저장 버튼: 빈 칸 검사 후 저장
$('save').onclick = () => {
  const key = $('f-key').value.trim();
  const p = {};
  F.forEach(k => p[k] = $('f-' + k).value.trim());
  if (p.level === NONE) p.score = '';
  const need = F.filter(k => !(k === 'score' && p.level === NONE));
  if (!key || need.some(k => !p[k])) {
    $('err').textContent = '모든 항목을 입력해 주세요';
    return;
  }
  apiKey = key;
  profile = p;
  localStorage.setItem('gkey', key);
  localStorage.setItem('profile', JSON.stringify(p));
  $('err').textContent = '';
  show('main');
};
$('settings').onclick = () => { fillForm(); show('setup'); };
$('back').onclick = () => show('main');

// 튜터 역할 문장 + 설정 정보
function buildSystem() {
  const lv = profile.level === NONE
    ? 'below elementary conversation (use very simple words)'
    : `${profile.level} ${profile.score}`;
  return `${BASE_SYSTEM}
Learner: age ${profile.age}, ${profile.gender}, English level: ${lv}. Field of interest: ${profile.field}. Match the level and use situations and words from that field.`;
}

// 말풍선 추가
function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
}

// 답변 읽어주기 (영어만)
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  speechSynthesis.speak(u);
}

// 제미나이에게 보내고 답 받기
async function send(text) {
  addMsg(text, 'user');
  history.push({ role: 'user', parts: [{ text }] });
  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: buildSystem() }] },
          contents: history.slice(-(MAX_TURNS * 2 - 1)),
          generationConfig: { temperature: 0.7, maxOutputTokens: 600 }
        })
      }
    );
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || res.status);
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!reply) throw new Error('빈 응답');
    history.push({ role: 'model', parts: [{ text: reply }] });
    // KO: 앞은 영어 답변, 뒤는 한국어 설명
    const [en, ko] = reply.split('KO:');
    if (en.trim()) { addMsg(en.trim(), 'ai'); speak(en); }
    if (ko) addMsg(ko.trim(), 'ko');
  } catch (e) {
    history.pop();  // 실패한 질문은 기록에서 제거
    addMsg('오류: ' + e.message, 'ai');
  }
}

// 마이크: 누르면 듣기 시작, 다시 누르면 끝내고 전송
const mic = $('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  mic.disabled = true;
  mic.textContent = '음성 인식 미지원 브라우저';
} else {
  const rec = new SR();
  rec.lang = 'en-US';
  let listening = false;  // 듣는 중 여부
  let heard = '';         // 말한 내용 누적
  rec.onresult = e => { heard += ' ' + e.results[0][0].transcript; };
  rec.onend = () => {
    if (listening) return rec.start();  // 말이 멈춰 끊겨도 계속 듣기
    mic.classList.remove('on');
    mic.textContent = '말하기';
    if (heard.trim()) send(heard.trim());
    heard = '';
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    listening = false;
    addMsg('마이크 오류: ' + e.error, 'ai');
  };
  mic.onclick = () => {
    if (listening) { listening = false; return rec.stop(); }
    speechSynthesis.cancel();
    heard = '';
    listening = true;
    rec.start();
    mic.classList.add('on');
    mic.textContent = '듣는 중... 다 말하면 다시 누르기';
  };
}

// 시작: 설정이 있으면 대화 화면, 없으면 설정 화면
fillForm();
show(profile && apiKey ? 'main' : 'setup');
</script>
</body>
</html>
