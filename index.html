  :root, :root[data-theme="dark"] {
    --bg: #0b0b0c; --surface: #1c1c1e; --surface2: #2a2a2d; --text: #f5f5f5; --sub: #a1a1a6; --line: #2c2c2e;
    --accent: #ffd43b; --accent-text: #ffd43b; --on-accent: #111;
    --user: #ffd43b; --on-user: #111;
    --ko: #16283d; --on-ko: #cfe3ff;
    --card: #25210f; --card-line: #5c4d10; --dash: #5c4d10;
    --notice: #33261a; --notice-line: #6b4a1f;
    --icon: #8e8e93; --icon-on: #ffd43b; --danger: #ff6b6b;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fff; --surface: #f1f3f5; --surface2: #e9ecef; --text: #222; --sub: #777; --line: #e3e6ea;
    --accent: #ffd43b; --accent-text: #e08a00; --on-accent: #222;
    --user: #ffe066; --on-user: #222;
    --ko: #e7f5ff; --on-ko: #1c3d5a;
    --card: #fff9db; --card-line: #ffe066; --dash: #d4c26a;
    --notice: #fff4e6; --notice-line: #ffd8a8;
    --icon: #9aa0a6; --icon-on: #f08c00; --danger: #e03131;
    color-scheme: light;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: contain; }  /* 아래로 당겨 새로고침되는 것 방지 */
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
         font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: var(--text); }

  /* 공통: 화면, 헤더, 뒤로가기 */
  .screen { flex: 1; flex-direction: column; min-height: 0; }
  .screen > .pad { flex: 1; overflow-y: auto; }
  .hd { flex: none; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px;
        min-height: 60px; padding: 0 12px; box-sizing: border-box; border-bottom: 1px solid var(--line); }
  .hd .brand { justify-self: center; }
  .sp { width: 40px; height: 40px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .pg { margin: 6px 0 16px; font-size: 24px; font-weight: 800; letter-spacing: -.4px; }
  .back { flex: none; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); }
  .back svg, .mcard svg { display: block; }
  .pad { padding: 16px 16px 28px; }
  .logo svg { display: block; }
  .title { font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
  .title b { color: var(--accent-text); }

  /* 시작 화면 */
  #home { flex: 1; overflow-y: auto; flex-direction: column; align-items: center; text-align: center;
          padding: max(26px, env(safe-area-inset-top)) 22px max(30px, env(safe-area-inset-bottom)); }
  #home .brand { margin-top: auto; }
  #home h1 { margin: 22px 0 8px; font-size: 27px; line-height: 1.2; font-weight: 800; letter-spacing: -.5px; }
  #home h1 b { color: var(--accent-text); }
  #home .sub { margin: 0; color: var(--sub); font-size: 14px; line-height: 1.55; }
  #stage { position: relative; flex: 1 1 auto; width: 100%; max-width: 400px; min-height: 230px; max-height: 340px;
           margin: 22px 0 24px; border-radius: 32px; border: 1px solid var(--line); overflow: hidden;
           background: radial-gradient(ellipse at 50% 58%, rgba(255, 212, 59, .18), #0f0f10 68%); }
  :root[data-theme="light"] #stage { border-color: transparent; background: radial-gradient(ellipse at 50% 58%, #2b2510 0%, #0b0b0c 76%); }
  #mascot { position: absolute; top: 9%; left: 50%; height: 82%; width: auto; transform: translateX(-50%);
            filter: drop-shadow(0 10px 24px rgba(255, 212, 59, .2)); }
  #start { display: flex; align-items: center; justify-content: center; gap: 10px; width: min(100%, 260px); height: 52px;
           margin-bottom: auto; padding: 0 22px; border: 0; border-radius: 26px;
           background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 800; }
  #start svg { display: block; }

  /* 메뉴 화면: 아이콘 칩 + 제목 + 동그란 화살표 카드, 기능이 늘면 아래로 한 줄씩 추가 */
  #menu { background: radial-gradient(ellipse 90% 26% at 88% 0%, rgba(255, 212, 59, .13), transparent 72%); }
  .eyebrow { margin: 2px 0 0; color: var(--sub); font-size: 13px; font-weight: 600; }
  #menu .pg { margin: 2px 0 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mcard { --tint: #a1a1aa; --tint-bg: rgba(161, 161, 170, .16);
           position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 22px;
           min-height: 138px; padding: 14px; border: 1px solid var(--line); border-radius: 24px;
           background: var(--surface); text-align: left; }
  .chip, .go { display: flex; align-items: center; justify-content: center; background: var(--tint-bg); color: var(--tint); line-height: 0; }
  .chip { width: 44px; height: 44px; border-radius: 14px; }
  .go { flex: none; width: 34px; height: 34px; border-radius: 50%; }
  .mrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .mt { font-size: 16px; font-weight: 800; line-height: 1.25; }
  .mt small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--sub); }
  .mcard:disabled { opacity: .55; cursor: default; }
  .mcard:disabled .go { display: none; }
  :root[data-theme="light"] .mcard { --tint: #6b7280; --tint-bg: rgba(107, 114, 128, .12); }
  .c-blue { --tint: #5aa9ff; --tint-bg: rgba(90, 169, 255, .16); }
  .c-green { --tint: #3fd6a0; --tint-bg: rgba(63, 214, 160, .16); }
  .c-purple { --tint: #c084fc; --tint-bg: rgba(192, 132, 252, .16); }
  :root[data-theme="light"] .c-blue { --tint: #1c7ed6; --tint-bg: rgba(28, 126, 214, .12); }
  :root[data-theme="light"] .c-green { --tint: #0ca678; --tint-bg: rgba(12, 166, 120, .12); }
  :root[data-theme="light"] .c-purple { --tint: #9c36b5; --tint-bg: rgba(156, 54, 181, .12); }
  :root .mcard.primary { grid-column: 1 / -1; min-height: 150px; border-color: transparent; background: var(--accent);
                         color: var(--on-accent); --tint: var(--on-accent); --tint-bg: rgba(0, 0, 0, .1); }
  .mcard.primary .go { background: #111; color: var(--accent); }
  .mcard.primary .mt small { color: rgba(0, 0, 0, .62); }
  .mcard.primary::after { content: ''; position: absolute; right: 14px; top: 14px; width: 68px; height: 68px; border-radius: 50%;
                          background: var(--avatar) center / cover no-repeat, #ffd43b; box-shadow: 0 0 0 4px rgba(0, 0, 0, .12); }

  
/* 앱 설치 안내 (설치 가능할 때만 보임) */
  .install { display: none; align-items: center; gap: 12px; width: 100%; margin-top: 14px; padding: 12px 14px;
             border: 1px dashed var(--line); border-radius: 20px; background: transparent; text-align: left;
             --tint: var(--accent-text); --tint-bg: rgba(255, 212, 59, .16); }
  .install .mt { flex: 1; }

  /* 설정 화면 */
  #setup label { display: block; margin-bottom: 14px; font-weight: 700; }
  #setup input, #setup select { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px 14px;
         font-size: 16px; font-weight: 400; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  #save { width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent);
          font-size: 17px; font-weight: 800; }
  #err { color: var(--danger); min-height: 1.2em; }
  #ver { margin: 16px 0 0; text-align: center; font-size: 12px; color: var(--sub); }
  .setrow { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 18px; padding: 10px 14px;
            border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 700; }
  .tsw { position: relative; display: flex; width: 88px; height: 40px; padding: 0; border: 0; border-radius: 20px; background: var(--surface2); }
  .tsw .ti { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center;
             color: var(--sub); transition: color .2s; }
  .tsw .ti svg { display: block; }
  .tsw .thumb { position: absolute; top: 3px; left: 3px; width: 40px; height: 34px; border-radius: 17px;
                background: var(--accent); transition: transform .2s; }
  :root[data-theme="dark"] .tsw .thumb { transform: translateX(42px); }
  :root[data-theme="light"] .tsw .ti:nth-child(1), :root[data-theme="dark"] .tsw .ti:nth-child(2) { color: var(--on-accent); }

  /* 대화 화면 */
  #main { flex: 1; flex-direction: column; min-height: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg { box-sizing: border-box; max-width: 82%; margin: 8px 0; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap;
         line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); color: var(--on-user); margin-left: auto; }
  .msg.ai { position: relative; min-height: 44px; padding-left: 46px; background: var(--surface); }
  .msg.ai::before { content: ''; position: absolute; left: 9px; top: 9px; width: 28px; height: 28px; border-radius: 50%;
                    background: var(--avatar) center / cover no-repeat, #ffd43b; }
  .msg.ko { background: var(--ko); color: var(--on-ko); font-size: 14px; }
  .msg.notice { background: var(--notice); border: 1px solid var(--notice-line); font-size: 14px; }
  .msg.notice b { display: block; margin-bottom: 4px; }

  
/* 입력 막대 */
  #bar { display: flex; align-items: center; gap: 8px; margin: 10px 12px 14px; padding: 6px 6px 6px 18px;
         border: 1px solid var(--line); border-radius: 28px; background: var(--surface); }
  #bar.listening { padding-left: 6px; }
  #inp { flex: 1; min-width: 0; padding: 10px 0; font-size: 16px; border: 0; outline: 0; background: transparent; }
  #inp::placeholder { color: var(--sub); }
  #act, #cancel { flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
                  display: flex; align-items: center; justify-content: center; }
  #act svg, #cancel svg { display: block; }
  #act { background: var(--accent); color: var(--on-accent); }
  #cancel { display: none; background: var(--surface2); color: var(--text); }
  #wave { display: none; flex: 1; justify-content: center; }
  #lang { flex: none; padding: 6px 10px; border: 0; border-radius: 14px; background: var(--surface2);
          color: var(--sub); font-size: 13px; font-weight: 700; }
  #lang.ko { background: var(--accent); color: var(--on-accent); }
  #bar.listening #inp, #bar.listening #lang { display: none; }
  #bar.listening #cancel, #bar.listening #wave { display: flex; }

  /* 단어 카드 */
  .w { text-decoration: underline dotted var(--icon); text-underline-offset: 3px; }
  .card { word-break: keep-all; max-width: 82%; margin: -2px 0 10px; padding: 10px 14px; border-radius: 14px;
          background: var(--card); border: 1px solid var(--card-line); font-size: 14px; }
  .vex { color: var(--sub); font-size: 13px; margin-top: 2px; }
  .vsave, .vdel, .vmore { padding: 6px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); }
  .vsave, .vmore { margin-top: 8px; }
  .srow { display: flex; align-items: center; gap: 2px; }
  .srow > span { min-width: 0; overflow-wrap: anywhere; }
  .vex.srow { align-items: flex-start; justify-content: space-between; color: var(--text); }
  .vex.srow > span { flex: 1; }
  .vex.srow .vspk { flex: none; padding: 0 0 0 6px; }
  .vspk { border: 0; background: none; padding: 0 6px; color: var(--icon); line-height: 0; vertical-align: middle; }
  .vspk.on { color: var(--icon-on); }

  /* 단어장, 기록 화면 */
  .vitem { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .vrow { display: flex; align-items: center; gap: 8px; }
  .vtxt { flex: 1; min-width: 0; cursor: pointer; }
  .vdet { padding-left: 8px; }
  .vw { font-size: 18px; font-weight: 800; }
  .vtitle { font-weight: 800; font-size: 16px; }
  .vitem, .vnote { word-break: keep-all; }
  .vnote { white-space: pre-line; color: var(--sub); font-size: 13px; }
  .vsec { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--dash); }
  .rprev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 듣는 중 파형, 답변 기다리는 점 */
  .bars { display: flex; align-items: center; gap: 4px; height: 28px; }
  .bars i { width: 4px; height: 100%; border-radius: 2px; background: var(--accent-text);
            animation: wave .9s ease-in-out infinite; }
  @keyframes wave { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .wait i { display: inline-block; width: 5px; height: 5px; margin-left: 4px;
            border-radius: 50%; background: var(--sub); animation: blink 1.2s infinite; }
  .wait i:nth-child(2) { animation-delay: .2s; }
  .wait i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
</style>

<script>
// 설정값: 여기만 고치면 됨
const MODEL = 'gemini-3.5-flash';  // 모델명
const MAX_TURNS = 6;               // API로 보낼 최근 대화 횟수
const SILENCE_MS = 5000;           // 이 시간 동안 말이 없으면 마이크 자동 종료
const LITE_MODEL = 'gemini-3.5-flash-lite';  // 단어 조회용 가벼운 모델
const BASE_SYSTEM = `You are a friendly English tutor for a Korean learner. Reply in 1-2 short English sentences and end with a simple question. Be perceptive: use the conversation so far and the learner's field of interest to guess what they most likely meant, and answer that.
The user's text may come from speech recognition: never comment on repeated words, fillers, capitalization, punctuation or apostrophes.
If the user asks in Korean how to say something in English: reply with only the natural English sentence (no extra question), then a new line "KO:" followed by "이렇게 말하면 돼요." and, if useful, one short note on a key word.
If the user asks a question about English (a word's meaning, usage, why something is wrong), in any language: answer briefly in Korean after "KO:" with no English part.
Only if the user made a real grammar or word-choice mistake, or the meaning is unclear or unfinished, add a new line starting with "KO:". In Korean, guess their intent and ask, in the form "혹시 ~라고 말하고 싶으셨어요? → natural English sentence" (if they seem to be asking something: "혹시 ~가 궁금하셨어요? → natural English question"). Then at most one short sentence on when the right word is used. No grammar lectures.
Otherwise do not write KO:.`;

const $ = id => document.getElementById(id);
const F = ['age', 'gender', 'level', 'score', 'field', 'time'];  // 저장할 설정 항목
const NONE = '초등회화 미만';
const dayKey = (() => {  // 오늘 날짜 (YYYY-MM-DD)
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
})();
let chats = JSON.parse(localStorage.getItem('chats') || '{}');  // 날짜별 대화 기록
let history = chats[dayKey] || [];  // 오늘 대화
const saveChats = () => localStorage.setItem('chats', JSON.stringify(chats));
let apiKey = localStorage.getItem('gkey') || '';
let profile = JSON.parse(localStorage.getItem('profile') || 'null');
let vocab = JSON.parse(localStorage.getItem('vocab') || '[]');  // 저장한 단어
const cache = new Map();  // 이번 접속 중 조회한 단어

// 아이콘: 선 두께 2, 현재 글자색을 따라감
const icon = (path, size = 22) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
const I_MIC = icon('<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>');
const I_SEND = icon('<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>');
const I_BACK = icon('<polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>');
const I_BOOK = icon('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>', 24);
const I_CLOCK = icon('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', 24);
const I_SLIDERS = icon('<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>', 24);
const I_ARROW = icon('<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>');
const I_CHAT = icon('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>');
const I_SUN = icon('<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>', 20);
const I_MOON = icon('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>', 20);
const I_SPK = icon('<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>', 18);

// 화면 전환
function show(screen) {
  ['home', 'menu', 'setup', 'main', 'vocab', 'hist'].forEach(s => {
    $(s).style.display = s === screen ? 'flex' : 'none';
  });
  stopSpeak();  // 화면을 옮기면 읽던 소리도 멈춤
  if (screen === 'menu') paintMenu();
  if (screen === 'main') $('chat').scrollTop = $('chat').scrollHeight;
}

// 화면 이동을 브라우저 기록과 연결: 안드로이드 뒤로가기가 앱 종료 대신 이전 화면으로 이어짐
function navTo(screen, extra = {}) {  // 화면 위에 화면을 쌓기
  const d = (window.history.state?.d || 0) + 1;
  window.history.pushState({ s: screen, d, ...extra }, '');
  show(screen);
}
function setRoot(screen) {  // 시작, 메뉴처럼 뿌리 화면은 기록을 쌓지 않고 교체
  window.history.replaceState({ s: screen, d: 0 }, '');
  show(screen);
}
function goBack() {  // 화면의 뒤로가기 화살표
  if ((window.history.state?.d || 0) > 0) window.history.back();
  else setRoot('menu');
}
window.addEventListener('popstate', e => {  // 시스템 뒤로가기
  const st = e.state || { s: 'home', d: 0 };
  if (st.s === 'vocab') renderVocab();
  if (st.s === 'setup') fillForm();
  if (st.s === 'hist') (st.day && chats[st.day] ? openDay(st.day) : renderHistList());
  show(st.s);
});

// 점수칸: 초등회화 미만이면 숨김
function toggleScore() {
  $('f-score').style.display = $('f-level').value === NONE ? 'none' : 'block';
}
$('f-level').onchange = toggleScore;

// 저장된 값을 입력칸에 채우기
function fillForm() {
  const p = profile || {};
  $('f-key').value = apiKey;
  F.forEach(k => $('f-' + k).value = p[k] || '');
  toggleScore();
  $('back').style.display = profile ? 'flex' : 'none';
  $('setuptitle').textContent = profile ? '설정' : '처음 설정';
}

// 저장 버튼: 빈 칸 검사 후 저장
$('save').onclick = () => {
  const key = $('f-key').value.trim();
  const p = {};
  F.forEach(k => p[k] = $('f-' + k).value.trim());
  if (p.level === NONE) p.score = '';
  const need = F.filter(k => !(k === 'score' && p.level === NONE));
  if (!key || need.some(k => !p[k])) {
    $('err').textContent = '모든 항목을 입력해 주세요';
    return;
  }
  apiKey = key;
  profile = p;
  localStorage.setItem('gkey', key);
  localStorage.setItem('profile', JSON.stringify(p));
  $('err').textContent = '';
  goBack();
};
$('back').onclick = goBack;

// 튜터 역할 문장 + 설정 정보
function buildSystem() {
  const lv = profile.level === NONE
    ? 'below elementary conversation (use very simple words)'
    : `${profile.level} ${profile.score}`;
  return `${BASE_SYSTEM}
Learner: age ${profile.age}, ${profile.gender}, English level: ${lv}. Field of interest: ${profile.field}. Match the level and use situations and words from that field.`;
}

// 말풍선 추가
function addMsg(text, cls, box = $('chat')) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

// 읽는 중인 문장 하나만 추적: 스피커 버튼은 읽는 동안 노란색
let cur = null, curText = '';
function refreshSpk() {
  document.querySelectorAll('.vspk').forEach(b => b.classList.toggle('on', !!cur && b.dataset.say === curText));
}
function stopSpeak() {
  speechSynthesis.cancel();
  cur = null;
  curText = '';
  refreshSpk();
}

// 답변 읽어주기 (영어만)
function speak(text) {
  if (!text.trim()) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  cur = u;
  curText = text;
  u.onend = u.onerror = () => { if (cur === u) { cur = null; curText = ''; refreshSpk(); } };
  speechSynthesis.speak(u);
  refreshSpk();
}

// 요소 만들기
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

// 제미나이 호출 공통 함수: 답변 글자만 돌려줌
async function gemini(body, model = MODEL, meta = {}) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify(body)
    }
  );
  const data = await res.json();
  if (!res.ok) {
    const err = new Error(data.error?.message || res.status);
    err.code = res.status;
    throw err;
  }
  const cand = data.candidates?.[0];
  meta.finish = cand?.finishReason || '';  // STOP이 아니면 중간에 멈춘 것
  const text = (cand?.content?.parts || []).map(p => p.text || '').join('');  // 여러 조각이면 이어 붙임
  if (!text) throw new Error('빈 응답');
  return text;
}

// 가벼운 작업(단어 조회 등)은 가벼운 모델로: 한도가 따로 계산됨. 없거나 한도 초과면 기본 모델로 재시도
async function lite(body) {
  try { return await gemini(body, LITE_MODEL); }
  catch (e) { if ((e.code === 404 || e.code === 429) && LITE_MODEL !== MODEL) return gemini(body); throw e; }
}

// 오류를 알아보기 쉬운 말로 바꾸기
function friendly(e) {
  const m = String(e.message || '');
  if (e.code === 429 || /quota|exhausted/i.test(m))
    return { key: true, title: 'AI 사용 한도에 도달했어요',
      body: 'API 키의 무료 사용량을 모두 썼거나 결제 금액이 소진됐어요. 잠시 뒤에 다시 시도하거나 다른 키로 바꿔 보세요.' };
  if (e.code === 403 || (e.code === 400 && /api key/i.test(m)))
    return { key: true, title: 'API 키를 확인해 주세요', body: '키가 올바르지 않거나 사용할 수 없는 상태예요.' };
  if (e.code === 503) return { title: '지금 AI가 붐벼요', body: '잠시 뒤에 다시 시도해 주세요.' };
  if (e instanceof TypeError) return { title: '인터넷 연결을 확인해 주세요', body: '서버에 연결하지 못했어요.' };
  return { title: '잠시 문제가 생겼어요', body: m };
}

// 응답을 줄 단위로 나누기 (번호 제거)
const lines = t => t.split('\n').map(l => l.replace(/^\s*[1-4][.)]\s*/, '').trim()).filter(Boolean);

// 단어 뜻 조회: 눌렀을 때만 짧게 호출
async function lookup(word, context) {
  const text = await lite({
    contents: [{ role: 'user', parts: [{ text:
      `Word: "${word}"\nSentence: "${context}"\nAnswer in exactly 4 lines, no labels, no numbering, no markdown:\nline 1: base form of the word (the word itself if already base)\nline 2: Korean meaning as "ⓝ 뜻" (noun), "ⓥ 뜻" (verb), "ⓐ 뜻" (adjective), "ⓓ 뜻" (adverb) or "ⓞ 뜻" (other). Put the sense used in the sentence first, at most 2 parts of speech joined by " · ", verbs in dictionary form like "ⓥ 달리다"\nline 3: one short English example sentence using the word\nline 4: Korean translation of line 3` }] }],
    generationConfig: { temperature: 0.1, maxOutputTokens: 1000 }
  });
  const [base, meaning, ex, exko] = lines(text);
  if (!exko) throw new Error('응답 형식 오류');
  return { base: base.toLowerCase(), meaning, ex, exko };
}

// 저장한 단어의 예문 목록 (옛 저장 형식도 읽기)
const exsOf = v => v.exs || (v.ex ? [{ ex: v.ex, exko: v.exko }] : []);

// 저장한 단어로 새 예문 하나 더 만들기
async function moreEx(v) {
  const text = await lite({
    contents: [{ role: 'user', parts: [{ text:
      `Word: "${v.w}" (${v.meaning})\nExisting sentences: ${exsOf(v).map(e => e.ex).join(' | ') || 'none'}\nWrite one new short English sentence using the word, different from the existing ones. Answer in exactly 2 lines, no labels, no numbering, no markdown:\nline 1: the sentence\nline 2: Korean translation` }] }],
    generationConfig: { temperature: 0.5, maxOutputTokens: 1000 }
  });
  const [ex, exko] = lines(text);
  if (!exko) throw new Error('응답 형식 오류');
  return { ex, exko };
}

// 단어 저장/찾기
const findWord = w => vocab.find(v => v.w === w);
const saveVocab = () => localStorage.setItem('vocab', JSON.stringify(vocab));

// 기본 단어 설명표: 누르면 예문 대신 쓰임 설명 (API 호출 없음)
const BASIC = {};
function addBasic(items, mark, note) {  // items: ['단어 뜻', ...]
  const table = note || items.join(' · ');
  items.forEach(it => {
    const [w, ...m] = it.split(' ');
    BASIC[w.toLowerCase()] = { meaning: `${mark} ${m.join(' ')}`, note: table };
  });
}
addBasic(['I 나는(주어)', 'my 나의(소유)', 'me 나를·나에게(목적)', 'mine 나의 것', 'myself 나 자신'], 'ⓞ');

addBasic(['she 그녀는(주어)', 'her 그녀의(소유)·그녀를(목적)', 'hers 그녀의 것', 'herself 그녀 자신'], 'ⓞ');

addBasic(['they 그들은(주어)', 'their 그들의(소유)', 'them 그들을·그들에게(목적)', 'theirs 그들의 것', 'themselves 그들 자신'], 'ⓞ');
addBasic(['am ~이다(I 전용)', 'is ~이다(he·she·it)', 'are ~이다(you·we·they)', 'was ~였다(I·he·she·it)',

// 스피커 버튼: 누르면 읽고(노란색), 읽는 중에 다시 누르면 멈춤(회색)

// 글자 한 줄 + 오른쪽 스피커

// 단어를 눌렀을 때: 읽어주기 + 뜻 카드
async function onWord(bubble, word, context) {
  const w = word.toLowerCase().replace('’', "'");
  speak(w);
  if (bubble.card) bubble.card.remove();
  const card = el('div', 'card', '찾는 중...');
  const next = bubble.nextElementSibling;
  (next && next.classList.contains('ko') ? next : bubble).after(card);  // 파란 설명 말풍선이 있으면 그 아래에
  bubble.card = card;
  try {
    const sv = findWord(w);
    // 기본 단어표 > 저장된 단어(뜻만) > 이번 접속 조회분 순, 모두 호출 없음
    let d = BASIC[w] ? { base: '', ...BASIC[w] } : sv ? { base: sv.base, meaning: sv.meaning } : cache.get(w);
    if (!d) { d = await lookup(w, context); cache.set(w, d); }
    const btn = el('button', 'vsave', sv ? '저장됨' : '저장');
    btn.disabled = !!sv;
    btn.onclick = () => {
      vocab.push(d.note ? { w, base: '', meaning: d.meaning }
        : { w, base: d.base !== w ? d.base : '', meaning: d.meaning, exs: [{ ex: d.ex, exko: d.exko }] });
      saveVocab();
      btn.textContent = '저장됨';
      btn.disabled = true;
    };
    card.textContent = '';
    card.append(speakRow(d.base && d.base !== w ? `${w} (${d.base})` : w, w, 'vtitle'), el('div', '', d.meaning));
    if (d.note) card.append(el('div', 'vnote vsec', d.note));
    else if (d.ex) {
      const sec = el('div', 'vsec');
      sec.append(speakRow(d.ex, d.ex, 'vex'), el('div', 'vex', d.exko));
      card.append(sec);
    }
    card.append(btn);
    card.scrollIntoView({ block: 'nearest' });  // 카드가 화면 밖이면 보이게
  } catch (e) {
    const f = friendly(e);
    card.textContent = '';
    card.append(el('b', '', f.title), el('div', 'vex', f.body));
  }
}

// 튜터 영어 답변: 단어마다 누를 수 있게 나눠서 표시
function addAiMsg(text, box = $('chat')) {
  const d = el('div', 'msg ai');
  text.split(/([A-Za-z'’]+)/).forEach((part, i) => {
    if (i % 2 === 0) return d.append(part);  // 단어가 아닌 부분
    const s = el('span', 'w', part);
    s.onclick = () => onWord(d, part, text);
    d.append(s);
  });
  box.append(d);
  box.scrollTop = box.scrollHeight;
}

// 저장된 대화 한 줄 그리기 (tap이 true면 단어를 누를 수 있음)
function drawMsg(m, box, tap) {
  const t = m.parts[0].text;
  if (m.role === 'user') return addMsg(t, 'user', box);
  const [en, ko] = t.split('KO:');  // KO: 앞은 영어, 뒤는 한국어 설명
  if (en.trim()) tap ? addAiMsg(en.trim(), box) : addMsg(en.trim(), 'ai', box);
  if (ko) addMsg(ko.trim(), 'ko', box);
}

// 단어장 목록 그리기 (최근 저장이 위, 누르면 예문 펼침)
function renderVocab() {
  const box = $('vlist');
  box.textContent = vocab.length ? '' : '저장한 단어가 없어요';
  [...vocab].reverse().forEach(v => {
    const det = el('div', 'vdet');
    det.style.display = 'none';
    const drawDet = () => {  // 예문 목록 + 더 보기 버튼
      det.textContent = '';
      if (BASIC[v.w]) return det.append(el('div', 'vnote vsec', BASIC[v.w].note));  // 기본 단어는 설명만
      exsOf(v).forEach(e => {
        const sec = el('div', 'vsec');
        sec.append(speakRow(e.ex, e.ex, 'vex'), el('div', 'vex', e.exko));
        det.append(sec);
      });
      const more = el('button', 'vmore', '예문 더 보기');
      more.onclick = async () => {
        more.disabled = true;
        more.textContent = '만드는 중...';
        try {
          v.exs = [...exsOf(v), await moreEx(v)];
          saveVocab();
          drawDet();
        } catch (err) {
          more.disabled = false;
          more.textContent = friendly(err).title + ' (다시 누르기)';
        }
      };
      det.append(more);
    };
    const line = el('div', 'vtxt');
    line.append(el('span', 'vw', v.w), `${v.base ? ` (${v.base})` : ''} : ${v.meaning}`);
    line.onclick = () => {
      const open = det.style.display === 'none';
      det.style.display = open ? 'block' : 'none';
      if (open) drawDet();
    };
    const del = el('button', 'vdel', '삭제');
    del.onclick = () => {
      if (!confirm(`'${v.w}' 삭제할까요?`)) return;
      vocab = vocab.filter(x => x.w !== v.w);
      saveVocab();
      renderVocab();
    };
    const spk = spkBtn(v.w);
    const row = el('div', 'vrow');
    row.append(spk, line, del);
    const item = el('div', 'vitem');
    item.append(row, det);
    box.append(item);
  });
}

// 그날 대화를 읽기 좋은 파일로 저장 (html: 한글이 안 깨지고 글자가 큼)
function exportDoc(d) {
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const body = chats[d].map(m => {
    const t = m.parts[0].text;
    if (m.role === 'user') return `<p class="u">${esc(t)}</p>`;
    const [en, ko] = t.split('KO:');
    return (en.trim() ? `<p class="a">${esc(en.trim())}</p>` : '') + (ko ? `<p class="k">${esc(ko.trim())}</p>` : '');
  }).join('');
  const css = 'body{font:19px/1.7 sans-serif;max-width:640px;margin:0 auto;padding:16px;color:#222}'
    + 'h1{font-size:22px}p{margin:10px 0;padding:10px 14px;border-radius:14px;white-space:pre-wrap}'
    + '.u{background:#ffe066;margin-left:15%}.a{background:#eee;margin-right:15%}'
    + '.k{background:#e7f5ff;font-size:17px;margin-right:15%}';
  const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">`
    + `<meta name="viewport" content="width=device-width, initial-scale=1"><title>${d} 영어 대화</title>`
    + `<style>${css}</style></head><body><h1>${d} 영어 대화</h1>${body}</body></html>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  a.download = `english-${d}.html`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// 제미나이에게 보내고 답 받기
async function send(text) {
  addMsg(text, 'user');
  history.push({ role: 'user', parts: [{ text }] });
  const wait = el('div', 'msg ai wait');  // 답변 기다리는 표시
  wait.innerHTML = '답변 정리하는 중<i></i><i></i><i></i>';
  $('chat').append(wait);
  $('chat').scrollTop = $('chat').scrollHeight;
  try {
    const meta = {};  // 응답 종료 사유 확인용
    const reply = await gemini({
      system_instruction: { parts: [{ text: buildSystem() }] },
      contents: history.slice(-(MAX_TURNS * 2 - 1)),
      generationConfig: { temperature: 0.7, maxOutputTokens: 1500 }
    }, MODEL, meta);
    history.push({ role: 'model', parts: [{ text: reply }] });
    chats[dayKey] = history;
    saveChats();
    drawMsg(history[history.length - 1], $('chat'), true);
    speak(reply.split('KO:')[0]);
    if (meta.finish && meta.finish !== 'STOP') {
      const why = { MAX_TOKENS: '답변이 길어서 중간에 잘렸어요', SAFETY: '안전 필터 때문에 답변이 중간에 멈췄어요' };
      addNote((why[meta.finish] || `답변이 중간에 멈췄어요 (${meta.finish})`) + '. 다시 물어봐 주세요.');
    }
  } catch (e) {
    history.pop();  // 실패한 질문은 기록에서 제거
    addNotice(e);
  } finally {
    wait.remove();
  }
}

// 입력 막대: 글자 입력 + 말하기를 버튼 하나로 (말하기 언어는 위쪽 EN | 한 스위치)
const bar = $('bar'), inp = $('inp'), act = $('act');
$('cancel').innerHTML = icon('<polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>');  // 꺾인 화살표
$('wave').innerHTML = '<span class="bars">'
  + Array.from({ length: 9 }, (_, k) => `<i style="animation-delay:${(k * 0.11).toFixed(2)}s"></i>`).join('') + '</span>';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let lang = 'en-US';     // 말하기 언어 (한국어는 한 번 말하면 EN으로 자동 복귀)
let listening = false;  // 듣는 중 여부
let heard = '';         // 확정된 말
let pending = '';       // 확정 전인 말
let silence;            // 무음 타이머

const closeCards = () => document.querySelectorAll('.card').forEach(c => c.remove());

// 말하기 언어 전환: EN <-> 한 (한국어는 한 번 쓰면 자동으로 EN 복귀)
const setLang = l => {
  lang = l;
  $('lang').textContent = l === 'en-US' ? 'EN' : '한';
  $('lang').classList.toggle('ko', l === 'ko-KR');
};
$('lang').onclick = () => setLang(lang === 'en-US' ? 'ko-KR' : 'en-US');

// 상태에 맞게 버튼 모양 바꾸기: 비어 있으면 마이크, 글자가 있거나 듣는 중이면 보내기
function paint() {
  bar.classList.toggle('listening', listening);
  act.innerHTML = listening || inp.value.trim() ? I_SEND : I_MIC;
}
inp.oninput = paint;

// 무음이 계속되면 자동으로 듣기 끝내기
const arm = () => {
  clearTimeout(silence);
  silence = setTimeout(() => { if (listening) { listening = false; rec.stop(); } }, SILENCE_MS);
};

const rec = SR ? new SR() : null;
if (rec) {
  rec.interimResults = true;
  rec.onspeechstart = arm;
  rec.onresult = e => {
    arm();  // 말소리가 들어오는 동안 타이머 갱신
    pending = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) heard += ' ' + t; else pending += t;
    }
  };
  rec.onend = () => {
    heard += ' ' + pending;  // 확정 전 말도 포함
    pending = '';
    if (listening) { rec.lang = lang; return rec.start(); }  // 말이 멈춰 끊겨도 계속 듣기
    clearTimeout(silence);
    paint();
    if (heard.trim()) {
      send(heard.trim());
      if (lang === 'ko-KR') setLang('en-US');  // 한국어는 한 번만
    }
    heard = '';
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    listening = false;
    addMsg('마이크 오류: ' + e.error, 'ai');
  };
  // 취소: 말한 내용을 버리고 끝내기
  $('cancel').onclick = () => {
    heard = '';
    pending = '';
    listening = false;
    rec.abort();
  };
} else {
  $('lang').style.display = 'none';
}

// 버튼: 듣는 중이면 끝내고 전송 / 글자가 있으면 전송 / 비어 있으면 듣기 시작
act.onclick = () => {
  if (listening) { listening = false; return rec.stop(); }
  closeCards();  // 단어 카드 닫기
  const t = inp.value.trim();
  if (t) { inp.value = ''; paint(); return send(t); }
  if (!rec) return addMsg('이 브라우저는 음성 입력을 지원하지 않아요. 글로 입력해 주세요', 'ai');
  stopSpeak();
  heard = '';
  pending = '';
  listening = true;
  rec.lang = lang;
  rec.start();
  arm();
  paint();
};
bar.onsubmit = e => {  // 키보드의 엔터(전송) 키
  e.preventDefault();
  if (inp.value.trim()) act.onclick();
};

// 테마: 스위치 오른쪽 = 다크, 왼쪽 = 라이트
let theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b0b0c' : '#ffffff';
}
$('themesw').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', theme);
  applyTheme();
};

// 아이콘 넣기
const LOGO = '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M6 4H26A4 4 0 0 1 30 8V20A4 4 0 0 1 26 24H14L8 29V24H6A4 4 0 0 1 2 20V8A4 4 0 0 1 6 4Z" fill="#ffd43b"/><ellipse cx="12" cy="14" rx="1.8" ry="2.6" fill="#222"/><ellipse cx="20" cy="14" rx="1.8" ry="2.6" fill="#222"/></svg>';
document.querySelectorAll('.logo').forEach(e => e.innerHTML = LOGO);
document.querySelectorAll('.back').forEach(b => b.innerHTML = I_BACK);
const sz = (svg, n) => svg.replace(/width="\d+" height="\d+"/, `width="${n}" height="${n}"`);
[['m-chat', I_CHAT], ['m-vocab', I_BOOK], ['m-hist', I_CLOCK], ['m-pron', I_MIC], ['m-set', I_SLIDERS]]
  .forEach(([id, svg]) => $(id).querySelector('.ic').innerHTML = sz(svg, 24));
document.querySelectorAll('.mcard .go').forEach(g => g.innerHTML = sz(I_ARROW, 18));
$('start').querySelector('.arrow').innerHTML = sz(I_ARROW, 20);
document.querySelectorAll('#themesw .ti')[0].innerHTML = I_SUN;
document.querySelectorAll('#themesw .ti')[1].innerHTML = I_MOON;

// 시작 화면 -> 메뉴 화면 -> 각 기능
function paintMenu() {
  const days = Object.keys(chats).filter(d => chats[d].length).length;
  $('today').textContent = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
  $('m-chat-sub').textContent = (chats[dayKey] || []).length ? '오늘 대화 이어서 하기' : '새 대화 시작하기';
  $('m-vocab-sub').textContent = vocab.length ? `${vocab.length}개 저장됨` : '아직 비어 있어요';
  $('m-hist-sub').textContent = days ? `${days}일 기록` : '아직 없어요';
}
$('start').onclick = () => setRoot('menu');
$('m-chat').onclick = () => navTo('main');
$('m-vocab').onclick = () => { renderVocab(); navTo('vocab'); };
$('m-hist').onclick = () => { renderHistList(); navTo('hist'); };
$('m-set').onclick = () => { fillForm(); navTo('setup'); };
$('chatback').onclick = goBack;

// 앱 설치: 서비스 워커 등록 + 설치 버튼 (설치 가능한 기기에서만 보임)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
let installEv = null;
const isApp = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const I_DL = icon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>');
$('install').querySelector('.ic').innerHTML = sz(I_DL, 24);
$('install').querySelector('.go').innerHTML = sz(I_ARROW, 18);
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installEv = e;
  if (!isApp()) $('install').style.display = 'flex';
});
window.addEventListener('appinstalled', () => { installEv = null; $('install').style.display = 'none'; });
$('install').onclick = async () => {
  if (!installEv) return;
  installEv.prompt();
  await installEv.userChoice;
  installEv = null;
  $('install').style.display = 'none';
};

// 시작: 오늘 대화 복원, 설정이 있으면 시작 화면, 없으면 설정 화면
applyTheme();
history.forEach(m => drawMsg(m, $('chat'), true));
paint();
fillForm();
setRoot(profile && apiKey ? 'home' : 'setup');
</script>
