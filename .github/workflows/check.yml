# 교재 자동 검사: 교재나 검사기가 바뀌어 올라오면 node tools/check.js 실행. 오류가 있으면 빨간 X
name: 교재 검사
on:
  push:
    paths: ['data/**', 'tools/**', 'index.html', '.github/workflows/check.yml']
  pull_request:
    paths: ['data/**', 'tools/**', 'index.html']
  workflow_dispatch:  # Actions 탭에서 직접 실행 버튼
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04  # 고정: ubuntu-latest가 바뀌어도 그대로
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7      # Node 24로 동작 (Node 20 경고 해결)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node tools/check.js
